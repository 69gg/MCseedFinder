[package]
name = "mcseed-finder"
version = "0.1.0"
edition = "2024"
description = "Fast, multithreaded Minecraft Java seed finder"
license = "MIT"
repository = "https://github.com/69gg/MCseedFinder"
build = "build.rs"
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/build.rs",
    "/examples/**",
    "/native/**",
    "/scripts/**",
    "/src/**",
    "/tests/**",
    "/tools/*.py",
    "/vendor/cubiomes/**",
]

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.5.58", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[build-dependencies]
cc = "=1.2.66"

[profile.release]
lto = "thin"
codegen-units = 1
